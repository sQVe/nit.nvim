id: require-function-annotations
language: Lua
severity: warning
message: >
  Public module functions with parameters must have LuaCATS ---@param annotations.
  Add ---@param name type before the function declaration.
ignores:
  - "tests/**"
rule:
  any:
    - pattern: "function M.$NAME($FIRST, $$$) $$$BODY end"
      not:
        follows:
          stopBy: neighbor
          kind: comment
          regex: "@param|@return"
    - pattern: "function M.$NAME($SINGLE) $$$BODY end"
      not:
        follows:
          stopBy: neighbor
          kind: comment
          regex: "@param|@return"

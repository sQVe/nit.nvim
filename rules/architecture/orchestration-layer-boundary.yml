id: orchestration-layer-boundary
language: Lua
severity: error
files:
  - "lua/nit/orchestration/**"
message: >
  orchestration/ must not import from display/ or ui/.
  Orchestration coordinates API mutations and state — UI reacts via observers.
rule:
  all:
    - pattern: require($MOD)
    - regex: "nit\\.(display|ui)\\."

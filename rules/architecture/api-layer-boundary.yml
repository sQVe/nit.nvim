id: api-layer-boundary
language: Lua
severity: error
files:
  - "lua/nit/api/**"
message: >
  api/ must not import from state/, display/, orchestration/, or ui/.
  The API layer is independent — pass data as function arguments.
rule:
  all:
    - pattern: require($MOD)
    - regex: "nit\\.(state|display|orchestration|ui)\\."

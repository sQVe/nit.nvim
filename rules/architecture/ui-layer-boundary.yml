id: ui-layer-boundary
language: Lua
severity: error
files:
  - "lua/nit/ui/**"
message: >
  ui/ must not import from api/, state/, display/, or orchestration/.
  The UI layer defines foundations only.
rule:
  all:
    - pattern: require($MOD)
    - regex: "nit\\.(api|state|display|orchestration)\\."

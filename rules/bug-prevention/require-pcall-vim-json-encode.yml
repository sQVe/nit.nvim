id: require-pcall-vim-json-encode
language: Lua
severity: error
message: >
  vim.json.encode must be wrapped in pcall — it throws on circular references and
  non-finite numbers. Use: local ok, result = pcall(vim.json.encode, data)
ignores:
  - "tests/**"
rule:
  pattern: vim.json.encode($ARG)
  not:
    inside:
      pattern: pcall($$$)

id: require-pcall-win-get-cursor
language: Lua
severity: error
message: >
  vim.api.nvim_win_get_cursor must be wrapped in pcall — window may be invalid.
  Use: local ok, cursor = pcall(vim.api.nvim_win_get_cursor, winid)
rule:
  pattern: vim.api.nvim_win_get_cursor($ARG)
  not:
    inside:
      pattern: pcall($$$)
